<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saaral Stock Management | Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .modal-active { display: flex !important; }
        .hidden-page { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .confirm-popup {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9);
            display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(8px);
        }
        .checkmark-circle {
            width: 100px; height: 100px; background: #22c55e; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            animation: scaleUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes scaleUp { from { transform: scale(0); } to { transform: scale(1); } }

        .product-scroll::-webkit-scrollbar { width: 6px; }
        .product-scroll::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 10px; }
        
        .date-container { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
        .date-small { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; opacity: 0.6; letter-spacing: 0.1em; }
        .date-big { font-size: 1.25rem; font-weight: 900; color: #818cf8; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <div id="confirm-animation" class="confirm-popup">
        <div class="text-center">
            <div class="checkmark-circle mx-auto mb-4"><i class="fas fa-check text-white text-5xl"></i></div>
            <h2 class="text-white text-2xl font-black uppercase tracking-widest">Order Assigned</h2>
        </div>
    </div>

    <div id="app-container">
        <nav class="bg-indigo-950 text-white p-4 sticky top-0 z-40 shadow-lg">
            <div class="container mx-auto flex justify-between items-center">
                <div class="flex items-center gap-6">
                    <div>
                        <h1 class="text-xl font-black tracking-tighter uppercase italic">Control Panel</h1>
                        <p class="text-[10px] text-indigo-300 font-bold tracking-[0.2em]">SAARAL STOCK MANAGEMENT</p>
                    </div>
                    <div class="hidden md:flex bg-white/10 rounded-xl p-1">
                        <button onclick="switchTab('dispatch')" id="tab-dispatch" class="px-4 py-2 rounded-lg text-xs font-black uppercase transition-all bg-white text-indigo-900">Dispatch</button>
                        <button onclick="switchTab('staff')" id="tab-staff" class="px-4 py-2 rounded-lg text-xs font-black uppercase transition-all hover:bg-white/10">Staff Directory</button>
                    </div>
                </div>
                <div class="text-right flex items-center gap-4">
                    <div class="date-container border-r border-white/10 pr-4">
                        <div id="header-day" class="date-small">TUE</div>
                        <div id="header-month" class="date-big">MAY 5</div>
                    </div>
                    <div id="header-time" class="text-2xl font-mono font-bold text-white leading-none">00:00:00</div>
                </div>
            </div>
        </nav>

        <main id="view-dispatch" class="container mx-auto p-4 lg:p-6 max-w-2xl">
            <section class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden mb-10">
                <div class="p-4 bg-slate-50 border-b border-slate-100 flex gap-2">
                    <div class="relative flex-1">
                        <input type="text" id="search-input" class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="Search products...">
                        <i class="fas fa-search absolute left-4 top-3.5 text-slate-400"></i>
                    </div>
                </div>
                <div class="overflow-x-auto max-h-[400px] product-scroll">
                    <table class="w-full text-left">
                        <tbody id="inventory-table" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </section>

            <div class="border-t border-slate-200 pt-8">
                <h3 class="text-sm font-black text-slate-500 uppercase tracking-[0.2em] mb-6 px-2">Live Activity</h3>
                <div id="instruction-log" class="flex flex-col gap-4 pb-20"></div>
            </div>
        </main>

        <main id="view-staff" class="container mx-auto p-4 lg:p-6 max-w-xl hidden">
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 mb-6">
                <h3 class="font-black uppercase text-sm mb-4 tracking-widest text-indigo-600">Add New Staff</h3>
                <div class="flex gap-2">
                    <input type="text" id="staff-name-input" class="flex-1 p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Enter name...">
                    <button onclick="addStaff()" class="bg-indigo-600 text-white px-6 rounded-2xl font-black uppercase text-xs">Add</button>
                </div>
            </div>
            <div id="staff-list" class="grid gap-3"></div>
        </main>
    </div>

    <div id="focus-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-md overflow-hidden">
            <div class="p-8 bg-slate-50 border-b border-slate-100">
                <h2 id="m-name" class="text-2xl font-black text-slate-800 uppercase"></h2>
            </div>
            <div class="p-8">
                <div class="mb-4">
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Assign to Staff</label>
                    <select id="m-staff-select" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-indigo-500 font-bold text-slate-700"></select>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Quantity</label>
                        <input type="number" id="m-qty" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-mono font-bold text-2xl" placeholder="0">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Action</label>
                        <button onclick="closeModal()" class="w-full p-4 bg-slate-200 text-slate-500 rounded-2xl font-black uppercase text-xs">Cancel</button>
                    </div>
                </div>
                <div class="mb-6">
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Instruction</label>
                    <textarea id="m-task" rows="2" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-sm" placeholder="Optional notes..."></textarea>
                </div>
                <button id="dispatch-btn" class="w-full py-5 bg-indigo-600 text-white font-black rounded-2xl shadow-xl shadow-indigo-100 uppercase tracking-widest">Confirm & Assign</button>
            </div>
        </div>
    </div>

    <script>
        const productNames = ["SILK SAREES", "SAREE", "FANCY SAREE", "COTTON SAREE", "BLOUSE", "BLOUSE BIT", "LINING CLOTH", "LINING BIT", "INSKIRT", "CHUDITHAR", "CHUDITHAR MATERIAL", "FROCK", "MIDI", "GOWN", "WESTERN", "TOPS", "LEGGINGS", "SHAAL", "NIGHTY", "NIGHT SUIT", "NIGHT DRESS", "BRA", "CHIMMIES", "PANTIES", "TIGHTS", "PETTICOAT", "JETTY", "GIFT BOX", "BABY DRESS", "BABY TOWEL", "PILLAIYAR PARIVATTAM", "AMMAN PATTU", "KAVI DHOTI", "BABA SUIT", "TROUSER SHIRT", "BOYS PANT SHIRT", "BOYS SHIRT", "BOYS JEANS PANT", "GENTS SHIRT", "GENTS PANT", "GENTS JEANS PANT", "SHIRTTING", "SUITTING", "SHIRTTING BIT", "SUITTING BIT", "WEDDING DHOTIS SHIRT", "BOYS DHOTIS SHIRT", "DHOTI", "LUNGI", "TOWEL", "SALVAI", "BRIEF", "BANIAN", "TRUNKS", "TRACK SUIT", "PANT 3/4", "SOCKS", "SHORTS", "GLOVES", "BED SHEET", "BED COVER", "PILLOW", "PILLOW COVER", "MAT", "PAAI", "MULL", "KAADA", "KERCHIEF", "CAP", "SAREE FALLS", "BANIAN SET", "BOYS COAT SUIT", "PATTU PAVADAI SET", "DOOR SCREEN", "WINDOW SCREEN", "T-SHIRT", "YOGA SHORTS", "SPORTS BRA", "PATIALA", "PATTU SAREE", "KERALA FANCY SAREE", "STONE WORK SAREE", "NIGHTY MATERIAL", "PANT SET", "SWEATER", "KERALA DHOTHI", "JAMMUKALAM", "BABY BED", "SCREEN PIECE", "NAVAKARAGA PATTU", "PATTI INSKIRT", "MASK", "MOSQUITO NET", "BED", "DHOTIS SET", "GYM VESTS", "RAIN COAT", "PANI KULLA", "TEA CLOTH", "NARIYAL", "IRUMUDI BAG", "DHAVANI", "LEHANGA", "JERKIN", "SKIRT", "PLAZO", "SHAPE WEAR", "JEGGINGS", "TABLE CLOTH", "JOGGERS", "BOYS PANT", "SHOE", "DENIM SHORTS", "DHOTI BELT", "POPLIN CLOTH", "SOFA COVER", "GENTS COAT", "CHRISTMAS DRESS", "CHRISTMAS CAP", "BOTTLE COVER", "SHIMMER", "BED PAAI", "KRISHNA DRESS", "LAB COAT", "BUTTERFLY WINGS", "MATERNITY WEAR", "SPIDERMAN DRESS", "DRY SHEET"];

        let historyData = JSON.parse(localStorage.getItem('saaral_v8_history')) || [];
        let staffData = JSON.parse(localStorage.getItem('saaral_v8_staff')) || ["Default Staff"];
        let activeProduct = null;

        function sync() {
            localStorage.setItem('saaral_v8_history', JSON.stringify(historyData));
            localStorage.setItem('saaral_v8_staff', JSON.stringify(staffData));
        }

        function switchTab(tab) {
            document.getElementById('view-dispatch').classList.toggle('hidden', tab !== 'dispatch');
            document.getElementById('view-staff').classList.toggle('hidden', tab !== 'staff');
            document.getElementById('tab-dispatch').className = tab === 'dispatch' ? 'px-4 py-2 rounded-lg text-xs font-black uppercase bg-white text-indigo-900' : 'px-4 py-2 rounded-lg text-xs font-black uppercase hover:bg-white/10';
            document.getElementById('tab-staff').className = tab === 'staff' ? 'px-4 py-2 rounded-lg text-xs font-black uppercase bg-white text-indigo-900' : 'px-4 py-2 rounded-lg text-xs font-black uppercase hover:bg-white/10';
            if(tab === 'staff') renderStaff();
        }

        function addStaff() {
            const name = document.getElementById('staff-name-input').value.trim();
            if(name) { staffData.push(name); document.getElementById('staff-name-input').value = ""; sync(); renderStaff(); }
        }

        function removeStaff(index) { staffData.splice(index, 1); sync(); renderStaff(); }

        function renderStaff() {
            const list = document.getElementById('staff-list');
            list.innerHTML = staffData.map((s, i) => `
                <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-slate-100">
                    <span class="font-bold text-slate-700">${s}</span>
                    <button onclick="removeStaff(${i})" class="text-red-400 hover:text-red-600 px-3"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }

        function updateTable(query = "") {
            const table = document.getElementById('inventory-table');
            table.innerHTML = productNames.filter(n => n.toLowerCase().includes(query.toLowerCase())).map(name => `
                <tr class="hover:bg-slate-50 cursor-pointer" onclick="openDispatch('${name}')">
                    <td class="px-6 py-5 font-bold text-slate-800 uppercase text-sm">${name}</td>
                    <td class="px-6 py-5 text-right"><button class="bg-indigo-50 text-indigo-600 px-5 py-2 rounded-xl text-[10px] font-black uppercase">Assign</button></td>
                </tr>
            `).join('');
        }

        function openDispatch(name) {
            activeProduct = name;
            document.getElementById('m-name').innerText = name;
            const select = document.getElementById('m-staff-select');
            select.innerHTML = staffData.map(s => `<option value="${s}">${s}</option>`).join('');
            document.getElementById('m-qty').value = "";
            document.getElementById('m-task').value = "";
            document.getElementById('focus-modal').classList.add('modal-active');
        }

        document.getElementById('dispatch-btn').onclick = () => {
            const qty = parseInt(document.getElementById('m-qty').value);
            const staff = document.getElementById('m-staff-select').value;
            if(!qty || qty <= 0) return alert("Enter quantity.");

            closeModal();
            document.getElementById('confirm-animation').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('confirm-animation').style.display = 'none';
                historyData.unshift({ id: Date.now(), productName: activeProduct, staff, qty, notes: document.getElementById('m-task').value || "Regular pick", time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})});
                sync(); renderHistory();
            }, 1000);
        };

        function renderHistory() {
            const log = document.getElementById('instruction-log');
            log.innerHTML = historyData.map(item => `
                <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm fade-in">
                    <div class="flex justify-between mb-3">
                        <div>
                            <p class="text-[10px] font-black text-indigo-600 uppercase tracking-tighter">${item.time} • Assigned to: ${item.staff}</p>
                            <h4 class="font-black text-slate-800 uppercase text-lg leading-tight">${item.productName}</h4>
                        </div>
                        <button onclick="deleteHistory(${item.id})" class="text-slate-300 hover:text-red-600 p-2"><i class="fas fa-trash-alt"></i></button>
                    </div>
                    <div class="flex items-center justify-between bg-slate-50 p-4 rounded-2xl">
                        <p class="text-xs text-slate-600 font-medium italic">"${item.notes}"</p>
                        <p class="text-lg font-black text-indigo-900 ml-4 whitespace-nowrap">Took ${item.qty}</p>
                    </div>
                </div>
            `).join('');
        }

        window.deleteHistory = (id) => { historyData = historyData.filter(i => i.id !== id); sync(); renderHistory(); };
        function closeModal() { document.getElementById('focus-modal').classList.remove('modal-active'); }
        document.getElementById('search-input').oninput = (e) => updateTable(e.target.value);
        setInterval(() => {
            const now = new Date();
            document.getElementById('header-time').innerText = now.toLocaleTimeString([], {hour12:false});
            document.getElementById('header-day').innerText = now.toLocaleDateString([], {weekday:'short'});
            document.getElementById('header-month').innerText = now.toLocaleDateString([], {month:'short', day:'numeric'}).toUpperCase();
        }, 1000);

        updateTable(); renderHistory();
    </script>
</body>
</html>
